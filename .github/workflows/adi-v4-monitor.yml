name: ADI INTERNATIONAL - V4.1 Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ADI V4.1 files
        run: |
          echo "=== ADI INTERNATIONAL V4.1 MONITOR ==="

          SCRIPT="adi_product_research_v4_1.py"
          REPORT="reports/daily-report-v4-latest.md"
          JSON="reports/daily-report-v4-latest.json"

          if [ -f "$SCRIPT" ]; then
            echo "OK: V4.1 script found"
            python3 -m py_compile "$SCRIPT"
            echo "OK: Python syntax valid"
          else
            echo "WARNING: V4.1 script missing"
          fi

          if [ -f "$REPORT" ]; then
            echo "OK: Latest Markdown report found"
          else
            echo "INFO: No latest Markdown report yet"
          fi

          if [ -f "$JSON" ]; then
            echo "OK: Latest JSON report found"
          else
            echo "INFO: No latest JSON report yet"
          fi

          echo "=== MONITOR FINISHED ==="
