name: ADI INTERNATIONAL - V4.1 Product Research

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read

jobs:
  product-research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate V4.1 script
        run: python -m py_compile adi_product_research_v4_1.py

      - name: Run ADI V4.1 supplier discovery
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python adi_product_research_v4_1.py

      - name: Upload V4.1 research reports
        uses: actions/upload-artifact@v4
        with:
          name: ADI-V4.1-Research-Report
          path: |
            reports/daily-report-v4-latest.md
            reports/daily-report-v4-latest.json
          if-no-files-found: error
          retention-days: 30
