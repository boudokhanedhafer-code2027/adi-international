
name: ADI INTERNATIONAL - Daily Supplier Research

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adi-daily-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run ADI product research
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python adi_research.py

      - name: Upload daily research report
        uses: actions/upload-artifact@v4
        with:
          name: ADI-Daily-Report
          path: reports/daily-report.md
          retention-days: 30

