
name: ADI INTERNATIONAL - Daily Supplier Report

on:
  schedule:
    # Every day at 06:00 UTC (07:00 in Tunisia)
    - cron: "0 6 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  adi-daily-report:
    name: Daily ADI Product Research
    runs-on: ubuntu-latest

    steps:
      - name: Download ADI repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start ADI supplier research
        run: |
          mkdir -p reports
          echo "ADI INTERNATIONAL" > reports/daily-report.txt
          echo "Daily supplier research" >> reports/daily-report.txt
          echo "Date: $(date -u)" >> reports/daily-report.txt
          echo "" >> reports/daily-report.txt
          echo "Research workflow started." >> reports/daily-report.txt
          echo "Supplier data connector not configured yet." >> reports/daily-report.txt
          echo "No automatic purchase or publication." >> reports/daily-report.txt

      - name: Save daily report
        uses: actions/upload-artifact@v4
        with:
          name: ADI-Daily-Report
          path: reports/daily-report.txt
          retention-days: 30
