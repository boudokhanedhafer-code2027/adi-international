ADI INTERNATIONAL
</span>
</footer>

<script>
/* GLOBE ANIMATION */
const globe = document.querySelector(".globe");

if(globe){
  globe.addEventListener("mousemove", e => {
    const r = globe.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width;
    const y = (e.clientY - r.top) / r.height;

    globe.style.transform =
      `rotateY(${(x-.5)*20}deg) rotateX(${(.5-y)*20}deg)`;
  });

  globe.addEventListener("mouseleave", () => {
    globe.style.transform = "";
  });
}

/* LANGUAGE */
let currentLang = "fr";

function toggleLang(){
  currentLang = currentLang === "fr" ? "en" : "fr";

  document.querySelectorAll("[data-fr][data-en]").forEach(el=>{
    el.textContent = el.getAttribute("data-"+currentLang);
  });

  const btn = document.querySelector(".lang");
  if(btn) btn.textContent = currentLang === "fr" ? "EN" : "FR";

  document.documentElement.lang = currentLang;
}

/* REQUEST FORM */
const form = document.getElementById("requestForm");

if(form){
  form.addEventListener("submit",function(e){
    e.preventDefault();

    const msg = document.getElementById("formMessage");
    if(msg){
      msg.textContent =
        currentLang === "fr"
        ? "Votre demande est préparée. Connectez votre système de réception pour l'envoyer."
        : "Your request is ready. Connect your receiving system to send it.";
    }

    form.reset();
  });
}

/* YEAR */
const year = document.getElementById("year");
if(year) year.textContent = new Date().getFullYear();

/* SCROLL REVEAL */
const observer = new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      entry.target.classList.add("visible");
    }
  });
},{threshold:0.12});

document.querySelectorAll(".product,.category,.ad-box").forEach(el=>{
  el.classList.add("reveal");
  observer.observe(el);
});
</script>

<style>
/* ANIMATIONS */
@keyframes globeFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-12px)}
}

@keyframes spin{

  to{transform:rotate(360deg)}
}

  to{transform:rotate(335deg)}
}

}

.reveal{
  opacity:0;
  transform:translateY(25px);
  transition:opacity .7s,transform .7s;
}

.reveal.visible{

  transform:translateY(0);
}
